_groups:
  - &math_libs Math and compute libraries
  - &comm_libs Communication libraries
  - &media_libs Media libraries
  - &storage Storage
  - &runtimes Runtime and compilers
  - &compilers Runtime and compilers
  - &profilers Profiling and debugging tools
  - &debuggers Profiling and debugging tools
  - &sys_tools Control and monitoring tools

# GitHub repo URLs are composed using `github_repo_repo_project`
rocm_core_sdk:
  components:
    AMD SMI:
      group: *sys_tools
      description: System management interface to control AMD GPU settings, monitor performance, and retrieve device and process information.
      xref:
        rtd_project: amdsmi
        github_repo: rocm-systems/projects/amdsmi
    Composable Kernel:
      group: *math_libs
      description: Provides a programming model for writing performance critical kernels for machine learning workloads across multiple architectures.
      xref:
        rtd_project: composable_kernel
        github_repo: rocm-libraries/projects/composablekernel
    HIP:
      group: *runtimes
      description: A C++ runtime API and kernel programming language designed for AMD GPUs. By providing an interface closely aligned with NVIDIA CUDA, HIP allows developers to write portable applications and efficiently migrate existing CUDA code to AMD platforms.
      xref:
        rtd_project: HIP
        github_repo: rocm-systems/projects/hip
    hipBLAS:
      group: *math_libs
      description: BLAS-marshalling library that supports rocBLAS and cuBLAS backends.
      xref:
        rtd_project: hipBLAS
        github_repo: rocm-libraries/projects/hipblas
    hipBLASLt:
      group: *math_libs
      description: Provides general matrix-matrix operations with a flexible API and extends functionalities beyond traditional BLAS library.
      xref:
        rtd_project: hipBLASLt
        github_repo: rocm-libraries/projects/hipblaslt
    hipCUB:
      group: *math_libs
      description: Thin header-only wrapper library on top of rocPRIM or CUB that allows project porting using the CUB library to the HIP layer.
      xref:
        rtd_project: hipCUB
        github_repo: rocm-libraries/projects/hipcub
    hipFile:
      group: *storage
      description: AMD's Infinity Storage library that provides direct-to-GPU I/O for the ROCm platform.
      xref:
        rtd_project: hipFile
        github_repo: rocm-systems/projects/hipfile
    hipFFT:
      group: *math_libs
      description: Fast Fourier Transforms (FFT)-marshalling library that supports rocFFT or cuFFT backends.
      xref:
        rtd_project: hipFFT
        github_repo: rocm-libraries/projects/hipfft
    HIPIFY:
      group: *compilers
      description: Translates CUDA source code into portable HIP C++.
      xref:
        rtd_project: HIPIFY
        github_repo: HIPIFY
    hipRAND:
      group: *math_libs
      description: Ports CUDA applications that use the cuRAND library into the HIP layer.
      xref:
        rtd_project: hipRAND
        github_repo: rocm-libraries/projects/hiprand
    hipSOLVER:
      group: *math_libs
      description: LAPACK-marshalling library that supports rocSOLVER and cuSOLVER backends.
      xref:
        rtd_project: hipSOLVER
        github_repo: rocm-libraries/projects/hipsolver
    hipSPARSE:
      group: *math_libs
      description: SPARSE-marshalling library that supports rocSPARSE and cuSPARSE backends.
      xref:
        rtd_project: hipSPARSE
        github_repo: rocm-libraries/projects/hipsparse
    LLVM:
      group: *compilers
      description: AMD’s LLVM-based compiler infrastructure, including the ROCm device compiler (amdclang), which compiles HIP and OpenCL code for AMD GPUs.
      xref:
        rtd_project: llvm-project
        github_repo: llvm-project/amd
    MIOpen:
      group: *math_libs
      description: An open source deep-learning library.
      xref:
        rtd_project: MIOpen
        github_repo: rocm-libraries/projects/miopen
    RCCL:
      group: *comm_libs
      description: Standalone library that provides multi-GPU and multi-node collective communication primitives.
      xref:
        rtd_project: rccl
        github_repo: rocm-systems/projects/rccl
    rocBLAS:
      group: *math_libs
      description: BLAS implementation (in the HIP programming language) on the ROCm runtime and toolchains.
      xref:
        rtd_project: rocBLAS
        github_repo: rocm-libraries/projects/rocblas
    ROCdbgapi:
      group: *debuggers
      description: ROCm debugger API library.
      xref:
        rtd_project: ROCdbgapi
        github_repo: rocm-systems/projects/rocdbgapi
    rocDecode:
      group: *media_libs
      description: Higithub_repo-performance SDK for access to video decoding features on AMD GPUs.
      xref:
        rtd_project: rocDecode
        github_repo: rocm-systems/projects/rocdecode
    rocFFT:
      group: *math_libs
      description: Software library for computing Fast Fourier Transforms (FFTs) written in HIP.
      xref:
        rtd_project: rocFFT
        github_repo: rocm-libraries/projects/rocfft
    ROCgdb:
      group: *debuggers
      description: Source-level debugger for Linux, based on the GNU Debugger (GDB).
      xref:
        rtd_project: ROCgdb
        github_repo: ROCgdb
    rocJPEG:
      group: *media_libs
      description: Library for decoding JPEG images on AMD GPUs.
      xref:
        rtd_project: rocJPEG
        github_repo: rocm-systems/projects/rocjpeg
    rocminfo:
      group: *sys_tools
      description: Reports system information.
      xref:
        rtd_project: rocminfo
        github_repo: rocm-systems/projects/rocminfo
    ROCm Compute Profiler:
      group: *profilers
      description: Kernel-level profiling for machine learning and higithub_repo performance computing (HPC) workloads.
      xref:
        rtd_project: rocprofiler-compute
        github_repo: rocm-systems/projects/rocprofiler-compute
    ROCm Data Center Tool:
      group: *sys_tools
      description: Simplifies administration and addresses key infrastructure challenges in AMD GPUs in cluster and data-center environments.
      xref:
        rtd_project: rdc
        github_repo: rocm-systems/projects/rdc
    ROCm Systems Profiler:
      group: *profilers
      description: Comprehensive profiling and tracing of applications running on the CPU or the CPU and GPU.
      xref:
        rtd_project: rocprofiler-systems
        github_repo: rocm-systems/projects/rocprofiler-systems
    ROCprofiler-SDK:
      group: *profilers
      description: Toolkit for developing analysis tools for profiling and tracing GPU compute applications.
      xref:
        rtd_project: rocprofiler-sdk
        github_repo: rocm-systems/projects/rocprofiler-sdk
    rocRAND:
      group: *math_libs
      description: Provides functions that generate pseudorandom and quasirandom numbers.
      xref:
        rtd_project: rocRAND
        github_repo: rocm-libraries/projects/rocrand
    ROCr Debug Agent:
      group: *debuggers
      description: Prints the state of all AMD GPU wavefronts that caused a queue error by sending a SIGQUIT signal to the process while the program is running.
      xref:
        rtd_project: rocr_debug_agent
        github_repo: rocm-systems/projects/rocr-debug-agent
    ROCr Runtime:
      group: *runtimes
      description:  An implementation of HSA runtime, which is a thin, user-mode API that exposes the necessary interfaces to access and interact with graphics hardware driven by the AMDGPU driver set and the ROCK kernel driver.
      xref:
        rtd_project: ROCR-Runtime
        github_repo: rocm-systems/projects/rocr-runtime
    rocSHMEM:
      group: *comm_libs
      description: An intra-kernel networking library that provides GPU-centric networking througithub_repo an OpenSHMEM-like interface.
      xref:
        rtd_project: rocSHMEM
        github_repo: rocm-systems/projects/rocshmem
    rocSOLVER:
      group: *math_libs
      description: An implementation of LAPACK routines on ROCm software, implemented in the HIP programming language and optimized for AMD’s latest discrete GPUs.
      xref:
        rtd_project: rocSOLVER
        github_repo: rocm-libraries/projects/rocsolver
    rocSPARSE:
      group: *math_libs
      description: Exposes a common interface that provides BLAS for sparse computation implemented on ROCm runtime and toolchains (in the HIP programming language).
      xref:
        rtd_project: rocSPARSE
        github_repo: rocm-libraries/projects/rocsparse
    rocPRIM:
      group: *math_libs
      description: Header-only library for HIP parallel primitives.
      xref:
        rtd_project: rocPRIM
        github_repo: rocm-libraries/projects/rocprim
    rocThrust:
      group: *math_libs
      description: Parallel algorithm library.
      xref:
        rtd_project: rocThrust
        github_repo: rocm-libraries/projects/rocthrust
    rocWMMA:
      group: *math_libs
      description: C++ library for accelerating mixed-precision matrix multiply-accumulate (MMA) operations.
      xref:
        rtd_project: rocWMMA
        github_repo: rocm-libraries/projects/rocwmma
    SPIRV-LLVM-Translator:
      group: *compilers
      description: A library and tool for translation between LLVM IR and SPIR-V.
      xref:
        github_repo: https://github.com/ROCm/SPIRV-LLVM-Translator

rocm_extras:
  - name: ROCm Validation Suite
    xref:
      rtd_project: ROCmValidationSuite
      github_repo: ROCmValidationSuite
