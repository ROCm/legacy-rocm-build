# Precision-support meta YAML.
#
# This is the human-edited file. Do NOT edit precision-support.yaml directly —
# it is assembled at Sphinx build time by the remote_yaml extension from the
# per-component precision-support.yaml files in each component's repository.
#
# Each library entry requires a `source` block with:
#   repo           GitHub repo ("owner/name")
#   path           Path to the component's precision-support.yaml in the repo
#   default_branch Branch to fetch from in non-release builds
#   tag_prefix     Prefix prepended to the version tag in release builds
#
# To update a library's data_types, edit its precision-support.yaml in the
# component repo. To add/remove a library or update doc_links, edit here.

library_groups:
  - group: "ML & Computer Vision"
    tag: "ml-cv"
    libraries:
      - name: "Composable Kernel"
        tag: "composable-kernel"
        doc_link: "composable_kernel:reference/Composable_Kernel_data_type_support"
        source:
          repo: "ROCm/rocm-libraries"
          path: "projects/composablekernel/docs/data/reference/precision-support.yaml"
          default_branch: "develop"
          tag_prefix: "docs/"

      - name: "MIGraphX"
