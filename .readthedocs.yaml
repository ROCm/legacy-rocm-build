# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

sphinx:
  configuration: docs/conf.py

formats: []

python:
  install:
    # Single entry point: the repo's own docs/sphinx/requirements.txt, which
    # pulls the pinned lockfile from the cloned rocm-docs-common (see the
    # post_checkout job below) rather than downloading it over HTTPS.
    - requirements: docs/sphinx/requirements.txt

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # Clone the shared build-data repo before dependencies are installed so the
    # pinned Sphinx lockfile (and the matching rocm-docs-core branch) is read
    # from this checkout. rocm-docs-core also reuses this clone for its data.
    post_checkout:
      - git clone --depth 1 --branch main https://github.com/neon60/rocm-docs-common.git rocm-docs-common
      # If docs/sphinx/requirements.txt still holds the default HTTPS line,
      # rewrite it to install from the local clone above (no HTTPS fetch on RTD).
      # If it has been customized (URL line removed), leave it untouched.
      - |
        if grep -q 'raw.githubusercontent.com/neon60/rocm-docs-common/main/env/sphinx/requirements.txt' docs/sphinx/requirements.txt; then
          sed -i 's#-r https://raw.githubusercontent.com/neon60/rocm-docs-common/main/env/sphinx/requirements.txt#-r ../../rocm-docs-common/env/sphinx/requirements.txt#' docs/sphinx/requirements.txt
        fi

search:
  ignore:
    - "**/archive/**"
    - "**/include/**"
    - "**/redirect/**"
